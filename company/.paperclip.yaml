schema: "paperclip/v1"
agents:
  diretor:
    role: "ceo"
    adapter:
      type: "opencode_local"
      config:
        command: "/home/pc/.opencode/bin/opencode"
        cwd: "/home/pc/Workspace/PQBR"
        model: "9router/core-alto"
        dangerouslySkipPermissions: false
        timeoutSec: 900
        graceSec: 15
        env:
          XDG_CONFIG_HOME: "/home/pc/Workspace/PQBR/company/opencode-config"
          OPENCODE_ALLOW_ALL_MODELS: "true"
    inputs:
      env:
        NINEROUTER_API_KEY:
          kind: secret
          requirement: optional
          default: ""
    runtime:
      heartbeat:
        enabled: false
        maxConcurrentRuns: 1
    budgetMonthlyCents: 2000
    permissions:
      canCreateAgents: true
      canCreateSkills: false
      canAssignTasks: true
  lider-editorial:
    role: "pm"
    adapter:
      type: "process"
      config:
        command: "/home/pc/Workspace/PQBR/scripts/paperclip/agente_pausado.sh"
