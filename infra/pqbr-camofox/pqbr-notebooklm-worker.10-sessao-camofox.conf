[Service]
# Camofox é o único rotacionador da sessão Google (playbook nlm-auth)
Environment=NOTEBOOKLM_DISABLE_KEEPALIVE_POKE=1
Environment=NOTEBOOKLM_REFRESH_CMD=/home/pc/.pqbr/camofox/nlm-sync.sh
Environment=NOTEBOOKLM_REFRESH_CMD_MIDSESSION=1
Environment=NOTEBOOKLM_REFRESH_STORAGE_PATH=/home/pc/.pqbr/notebooklm/profiles/pqbr/storage_state.json
